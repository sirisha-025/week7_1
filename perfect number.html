    <script>
        let a = 28;
        let temp = a;
        let sum = 0;
        for (let i = 1; i < a; i++){
            if(a % i == 0){
                sum += i;
            }
        }
        if(sum == temp){
            document.write("perfect");
         }else{
            document.write("Not perfect");
         }
    </script>
